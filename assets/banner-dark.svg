<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Pedro G. Braz — Founder of Cooud">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.15" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="1280" height="400" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1280" height="400" rx="24" fill="#0a0a0a"/>
  <rect width="1280" height="400" fill="url(#grid)" mask="url(#m)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
