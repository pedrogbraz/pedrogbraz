    <text x="76" y="210" font-size="84" fill="#ededed" letter-spacing="-2">Pedro G. Braz</text>
    <text x="78" y="262" font-size="28" fill="#a1a1a1" letter-spacing="-0.5">I build products end to end — payments, interfaces and native apps.</text>
    <text x="78" y="336" font-size="18" fill="#a1a1a1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">COOUD  ·  COOUD EXCHANGE  ·  CRONUS UI  ·  HALO</text>
  </g>
